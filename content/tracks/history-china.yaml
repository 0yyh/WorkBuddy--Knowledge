id: history-china
title: 中国历史主线
category: 历史/中国史
order_mode: chronological
timeline: china
description: 从中国本土视角的历史主线，按时间顺序串联从先秦到当代的关键事件与制度。这条线索聚焦大一统格局的形成、专制集权的演进与选官制度的变迁，以及近代以来的变局与重生，并与世界史主线在丝路、鸦片战争等节点交汇。
items:
  - order: "1"
    entry: western-zhou-foundation
    title: "西周建立·牧野之战"
    sort_date: -1046
    date_label: "公元前1046年"
    era: "古代"
    note: "周武王联军于牧野大破商纣王，纣王自焚，商亡周兴，史称武王克商。周推行分封制与宗法礼乐，确立「普天之下莫非王土」的天下秩序与天命观，奠定华夏共同体的政治文化原型，分封—宗法格局延续数百年。"
  - order: "2"
    entry: qin-han-unification
    sort_date: -221
    date_label: "公元前221年"
    era: "古代"
    note: "公元前230至前221年，秦王嬴政奋六世之余烈，十年间依次灭韩赵魏楚燕齐，于前221年称始皇帝，建立中国首个中央集权的统一帝国。废分封行郡县，书同文、车同轨、统一度量衡与货币、立皇帝制度；汉承秦制并于武帝（前141—前87）独尊儒术，形成「外儒内法」的治理传统，帝国范式自此定型。"
  - order: "3"
    entry: silk-road
    sort_date: -138
    date_label: "公元前138年"
    era: "古代"
    note: "前138年与前119年，汉武帝两遣张骞出使西域，联络大月氏、乌孙夹击匈奴，虽军事目的未竟，却打通中原—中亚—西亚—地中海的官方通道。丝路成为佛教东传与物种、技术交流的网络，使中国史首次深度嵌入世界史，故标注为跨中国/世界双时间线。"
    cross_timeline: true
  - order: "4"
    entry: han-wudi-confucianism
    title: "汉武帝·独尊儒术"
    sort_date: -134
    date_label: "公元前134年"
    era: "古代"
    note: "建元元年（前140）武帝即位，元光元年（前134）采董仲舒之议「罢黜百家，表章六经」，立五经博士、兴太学，儒家升至国家意识形态。配合推恩令削藩、盐铁官营、北击匈奴，中央集权达于新高，儒家正统自此延续两千年。"
  - order: "5"
    entry: battle-of-red-cliffs
    title: "赤壁之战"
    sort_date: 208
    date_label: "208年"
    era: "古代"
    note: "建安十三年（208），孙权、刘备联军于赤壁以火攻大破曹操，奠定三分天下。此后曹丕、刘备、孙权先后称帝，魏蜀吴鼎立，门阀政治与九品中正制登场，统一暂歇而区域文化多元竞放。"
  - order: "6"
    entry: sui-tang
    sort_date: 581
    date_label: "581年"
    era: "古代"
    note: "开皇九年（589）隋灭陈，结束近三百年分裂重归一统。隋创科举（进士科始于605）、修大运河、立三省六部，制度集大成；唐承其制而臻于鼎盛，兼容胡汉、气度恢廓，盛唐气象亦为此后中国文化的精神坐标。"
  - order: "7"
    entry: imperial-exam
    sort_date: 605
    date_label: "605年"
    era: "古代"
    note: "隋设进士科、唐渐成定制，科举取士通行千年，打破门第垄断、以考试选官。它重塑了社会流动与士大夫政治，将读书与权力绑为一体，深刻塑造了中国的教育与政治文化。"
  - order: "8"
    entry: an-lushan-rebellion
    title: "安史之乱"
    sort_date: 755
    date_label: "755年"
    era: "古代"
    note: "天宝十四载（755）安禄山、史思明叛，战火八年，玄宗奔蜀、肃宗灵武即位。乱后藩镇割据、宦官专权、经济重心南移，唐由盛转衰，中原凋敝而江南兴起，帝国内部格局为之一变。"
  - order: "9"
    entry: jingkang-incident
    title: "靖康之变"
    sort_date: 1127
    date_label: "1127年"
    era: "古代"
    note: "靖康二年（1127）金军破汴京，徽钦二帝被俘北去，北宋亡。宋室南渡，建炎元年（1127）高宗赵构于南京应天府即位，史称南宋，偏安江南；岳飞抗金与朱熹理学于此际兴起。"
  - order: "10"
    entry: yuan-unification
    title: "元灭宋·大一统"
    sort_date: 1279
    date_label: "1279年"
    era: "古代"
    note: "祥兴二年（1279）崖山海战陆秀夫负幼帝投海，宋亡。元（1271忽必烈改国号）首次由少数民族完成全域一统，行中书省制、贯通南北，海陆丝路在「蒙古和平」下空前畅通，马可·波罗即借此来华。"
  - order: "11"
    entry: song-dynasty
    sort_date: 960
    date_label: "960年"
    era: "古代"
    note: "宋重文轻武、文人治国，商品经济与城市生活高度发达，活字印刷、火药、指南针等技艺趋于成熟。然强干弱枝、冗兵冗官，军事积弱而屡受制于北方民族，繁荣与困境并存，折射出文治政府的特质与短板。"
  - order: "12"
    entry: ming-dynasty
    sort_date: 1368
    date_label: "1368年"
    era: "古代"
    note: "明废丞相、设内阁，君主专制达于极盛；郑和七下西洋（1405—1433）彰显航海能力，却随即海禁收缩。江南市镇与白银经济兴盛、商品化深入，同时面临倭患与内陆治理压力，闭关与开放张力初显。"
  - order: "13"
    entry: qing-dynasty
    sort_date: 1636
    date_label: "1636年"
    era: "古代"
    note: "清为最后一个王朝，1636年改国号为清、1644年入关，康乾盛世奠定多民族统一国家的疆域与治理格局，人口与疆域空前。然盛世之下制度僵化、闭关与人口压力并存，为近代的变局埋下伏笔。"
  - order: "14"
    entry: opium-war
    sort_date: 1840
    date_label: "1840年6月"
    era: "近代"
    note: "1840年6月英舰抵粤，鸦片战争的炮声轰开闭关之门，中国近代史由此开端。一系列不平等条约与割地赔款使天朝中心的世界观崩塌，屈辱与求变的双重冲动推动洋务运动、维新与革命接连登场，亦与世界殖民扩张同频。"
    cross_timeline: true
  - order: "15"
    entry: taiping-rebellion
    title: "太平天国运动"
    sort_date: 1851
    date_label: "1851年"
    era: "近代"
    note: "道光三十年（1851）洪秀全金田起义，建太平天国，1853年定都天京，纵横十余省，沉重打击清廷也酿巨大浩劫。洋务派随之以「自强」「求富」办工厂、练新军，开启近代化自救，中央权力渐下移。"
  - order: "16"
    entry: first-sino-japanese-war
    title: "甲午战争"
    sort_date: 1894
    date_label: "1894年"
    era: "近代"
    note: "光绪二十年（1894）中日为朝鲜爆发战争，黄海海战失利、北洋水师覆灭；1895年《马关条约》割台湾澎湖、赔银二亿两。洋务运动破产，列强瓜分狂潮掀起，戊戌变法随之登场，民族危机空前加深。"
  - order: "17"
    entry: hundred-days-reform
    title: "戊戌变法"
    sort_date: 1898
    date_label: "1898年"
    era: "近代"
    note: "光绪二十四年（1898）康有为、梁启超辅光绪帝行百日维新，倡立宪、废八股、兴学堂、练新军。慈禧发动政变囚帝、杀六君子，变法夭折，证明体制内改良之难，革命呼声由此转盛。"
  - order: "18"
    entry: xinhai-revolution
    title: "辛亥革命"
    sort_date: 1911
    date_label: "1911年10月10日"
    era: "近代"
    note: "宣统三年辛亥（1911）10月10日武昌起义爆发，各省响应，两千年帝制终结。1912年1月1日中华民国成立，孙中山就任临时大总统，亚洲首个共和国诞生，然北洋混战、军阀割据继之，共和之路曲折。"
  - order: "19"
    entry: may-fourth-movement
    sort_date: 1919
    date_label: "1919年5月4日"
    era: "近代"
    note: "巴黎和会外交失利触发五四运动，新文化运动与爱国浪潮合流。民主与科学被高举，马克思主义广泛传播，白话文取代文言，思想解放与政治激变在此交汇，深刻塑造了现代中国的走向。"
  - order: "20"
    entry: anti-japanese-war
    sort_date: 1937
    date_label: "1937年7月7日"
    era: "近代"
    note: "自1931年九一八事变东北沦陷，至1937年七七卢沟桥事变全面抗战爆发，抗日战争进入全民族阶段，国共合作、持久抗战。这是洗雪民族耻辱、重塑国家认同的转折，也彻底改变了中国内部力量对比。"
  - order: "21"
    entry: prc-founding
    title: "中华人民共和国成立"
    sort_date: 1949
    date_label: "1949年10月1日"
    era: "现当代"
    note: "1949年10月1日开国大典，毛泽东宣告中华人民共和国成立，定都北京。新民主主义转向社会主义改造，独立自主的外交与计划经济奠基，现代中国就此开启，并为后续改革开放积蓄结构条件。"
  - order: "22"
    entry: reform-and-opening
    sort_date: 1978
    date_label: "1978年12月"
    era: "现当代"
    note: "1978年12月十一届三中全会确立改革开放，由计划经济转向社会主义市场经济，设立经济特区、融入全球贸易体系。四十年间经济腾飞、数亿人口脱贫，中国深度重返世界舞台，与全球化的浪潮彼此塑造。"
