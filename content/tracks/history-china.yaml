id: history-china
title: 中国历史主线
category: 历史/中国史
order_mode: chronological
timeline: china
description: 从中国本土视角的历史主线，按时间顺序串联从先秦到当代的关键事件与制度。这条线索聚焦大一统格局的形成、专制集权的演进与选官制度的变迁，以及近代以来的变局与重生，并与世界史主线在丝路、鸦片战争等节点交汇。
items:
  - order: "1"
    entry: qin-han-unification
    sort_date: -221
    date_label: "公元前221年"
    era: "古代"
    note: "秦并六国，建立中央集权的郡县制，书同文、车同轨、统一度量衡，奠定此后两千年大一统的政治底色。汉承秦制并独尊儒术，形成“外儒内法”的治理传统，帝国范式自此定型。"
  - order: "2"
    entry: silk-road
    sort_date: -138
    date_label: "公元前138年"
    era: "古代"
    note: "张骞凿空西域，打通中原与中亚、西亚乃至地中海的官方通道。丝路不仅是丝绸与货物的商路，更是佛教东传、技术与物种交流的网络，使中国史首次深度嵌入世界史，故标注为跨中国/世界双时间线。"
    cross_timeline: true
  - order: "3"
    entry: sui-tang
    sort_date: 581
    date_label: "581年"
    era: "古代"
    note: "隋结束数百年分裂重归一统，开运河、创科举；唐承其制而臻于鼎盛，兼容胡汉、气度恢廓。制度集大成的科举与三省六部，成为东亚政治文明的范本，盛唐气象亦为此后中国文化的精神坐标。"
  - order: "4"
    entry: imperial-exam
    sort_date: 605
    date_label: "约605年"
    era: "古代"
    note: "隋设进士科、唐渐成定制，科举取士通行千年，打破门第垄断、以考试选官。它重塑了社会流动与士大夫政治，将读书与权力绑为一体，深刻塑造了中国的教育与政治文化。"
  - order: "5"
    entry: song-dynasty
    sort_date: 960
    date_label: "960年"
    era: "古代"
    note: "宋重文轻武、文人治国，商品经济与城市生活高度发达，活字印刷、火药、指南针等技艺趋于成熟。然强干弱枝、冗兵冗官，军事积弱而屡受制于北方民族，折射出繁荣与困境的并存。"
  - order: "6"
    entry: ming-dynasty
    sort_date: 1368
    date_label: "1368年"
    era: "古代"
    note: "明废丞相、设内阁，君主专制达于极盛；郑和七下西洋彰显航海能力，却随即海禁收缩。江南市镇与白银经济兴盛、商品化深入，同时面临倭患与内陆治理压力。"
  - order: "7"
    entry: qing-dynasty
    sort_date: 1636
    date_label: "1636年"
    era: "古代"
    note: "清为最后一个王朝，康乾盛世奠定多民族统一国家的疆域与治理格局，人口与疆域空前。然盛世之下制度僵化、闭关与人口压力并存，为近代的变局埋下伏笔。"
  - order: "8"
    entry: opium-war
    sort_date: 1840
    date_label: "1840年"
    era: "近代"
    note: "鸦片战争的炮声轰开闭关之门，中国近代史由此开端。一系列不平等条约与割地赔款使天朝中心的世界观崩塌，屈辱与求变的双重冲动推动洋务运动、维新与革命接连登场，亦与世界殖民扩张同频。"
    cross_timeline: true
  - order: "9"
    entry: may-fourth-movement
    sort_date: 1919
    date_label: "1919年"
    era: "近代"
    note: "巴黎和会外交失利触发五四运动，新文化运动与爱国浪潮合流。民主与科学被高举，马克思主义广泛传播，白话文取代文言，思想解放与政治激变在此交汇，深刻塑造了现代中国的走向。"
  - order: "10"
    entry: anti-japanese-war
    sort_date: 1937
    date_label: "1937年"
    era: "近代"
    note: "从九一八到七七，抗日战争进入全民族阶段，国共合作、持久抗战。这是洗雪民族耻辱、重塑国家认同的转折，战争也彻底改变了中国内部力量对比，为后续历史埋下伏笔。"
  - order: "11"
    entry: reform-and-opening
    sort_date: 1978
    date_label: "1978年"
    era: "现当代"
    note: "十一届三中全会确立改革开放，由计划经济转向社会主义市场经济，设立特区、融入全球贸易体系。四十年间经济腾飞、数亿人口脱贫，中国深度重返世界舞台，与全球化的浪潮彼此塑造。"
