id: civilization-cross
title: 文明长河 · 跨领域对照
category: 综合
order_mode: chronological
description: 把世界历史、哲学史与科学技术史的里程碑置于同一时间轴对照，呈现思想、科学与社会的相互呼应。当你看见孔子与柏拉图几乎同时发声、牛顿力学与启蒙并行、进化论与工业革命交织，便会理解文明是跨领域、跨地域的长河。
items:
  - order: "1"
    entry: ancient-egypt
    sort_date: -3100
    date_label: "约公元前3100年"
    era: "古代"
    note: "上下埃及统一，文明的黎明。与同期两河流域并立，人类最早的国家与文字在此成熟。"
  - order: "2"
    entry: ancient-greek-philosophy
    sort_date: -585
    date_label: "约公元前6世纪"
    era: "古代"
    note: "哲学与科学在爱琴海畔同声开端，米利都学派追问本原。它与东方诸子几乎同时，却走出不同的理性路径。"
  - order: "3"
    entry: confucius
    sort_date: -551
    date_label: "公元前551年"
    era: "古代"
    note: "东方伦理哲学的奠基，以仁礼重塑秩序。与柏拉图同年代遥相呼应，东西各自定义“人应当如何生活”。"
  - order: "4"
    entry: plato
    sort_date: -387
    date_label: "公元前387年"
    era: "古代"
    note: "西方形而上学的奠基，理念论划分现象与真实。与孔子相向而行，一个向外建立礼制、一个向内求索理型。"
  - order: "5"
    entry: aristotle
    sort_date: -343
    date_label: "公元前343年"
    era: "古代"
    note: "知识的总汇，贯通哲学与自然研究。其体系经阿拉伯回传，成为中世纪与近代的学术骨架。"
  - order: "6"
    entry: euclidean-geometry
    sort_date: -300
    date_label: "约公元前300年"
    era: "古代"
    note: "公理化演绎的典范，科学的数学化先声。牛顿与爱因斯坦的宇宙，都建立在这种“从公理出发”的纪律上。"
  - order: "7"
    entry: qin-han-unification
    sort_date: -221
    date_label: "公元前221年"
    era: "古代"
    note: "中国大一统格局确立，与罗马共和国同期而东西并立。两个帝国以不同方式把广土众民纳入秩序。"
  - order: "8"
    entry: silk-road
    sort_date: -138
    date_label: "公元前138年"
    era: "古代"
    note: "贯通东西方的交流网络，跨中国/世界双时间线。货物、佛教与技术的流动，使文明长河首次跨洲交织。"
    cross_timeline: true
  - order: "9"
    entry: roman-empire
    sort_date: -27
    date_label: "公元前27年"
    era: "古代"
    note: "地中海古典文明的高峰，罗马法奠定后世政治语言。其衰亡与基督教的兴起，为中世纪埋下伏笔。"
  - order: "10"
    entry: scholasticism
    sort_date: 1100
    date_label: "约11—13世纪"
    era: "中世纪"
    note: "理性与信仰的调和，古典向近代的渡桥。阿奎那以亚里士多德论证神学，大学与演绎体系在此成熟。"
  - order: "11"
    entry: renaissance
    sort_date: 1400
    date_label: "约14—15世纪"
    era: "中世纪"
    note: "人文主义复兴古典，欧洲走向近代。印刷术与艺术繁荣，使个性与理性重新抬头。"
  - order: "12"
    entry: printing-press
    sort_date: 1440
    date_label: "约1440年"
    era: "中世纪"
    note: "知识传播革命，思想扩散的物质基础。它让宗教改革与科学交流得以规模发生，是长河提速的齿轮。"
  - order: "13"
    entry: age-of-discovery
    sort_date: 1492
    date_label: "1492年"
    era: "中世纪"
    note: "新航路开辟，全球首次连成一体。白银与作物跨洋流动，世界史进入真正的全球阶段。"
  - order: "14"
    entry: machiavelli
    sort_date: 1513
    date_label: "约1513年"
    era: "中世纪"
    note: "《君主论》剥离道德与统治，政治现实主义登场。与宗教改革同松动中古秩序，国家理由开始独立。"
  - order: "15"
    entry: scientific-revolution
    sort_date: 1543
    date_label: "1543年"
    era: "近代"
    note: "从神学权威转向可检验的数学规律，自然被重新理解。伽利略与牛顿接力，理性接管宇宙。"
  - order: "16"
    entry: descartes
    sort_date: 1637
    date_label: "1637年"
    era: "近代"
    note: "以“我思”重建知识地基，近代哲学奠基。主体与理性的优先，开启认识论的新篇章。"
  - order: "17"
    entry: classical-mechanics
    sort_date: 1687
    date_label: "1687年"
    era: "近代"
    note: "牛顿力学，自然的数学化集大成。它为启蒙与工业革命提供宇宙观与理论引擎。"
  - order: "18"
    entry: enlightenment
    sort_date: 1700
    date_label: "约18世纪"
    era: "近代"
    note: "以理性审视权威，倡自由平等人权。洛克与卢梭的思想，点燃欧美革命，也塑造现代价值。"
  - order: "19"
    entry: steam-engine
    sort_date: 1712
    date_label: "1712年"
    era: "近代"
    note: "蒸汽动力开启机器时代，第一次工业革命的心脏。化石能量转化为功，社会结构随之剧变。"
  - order: "20"
    entry: industrial-revolution
    sort_date: 1760
    date_label: "约1760年"
    era: "近代"
    note: "生产力革命与资本主义世界体系扩张。城市、阶级与殖民在此重构，现代经济骨架搭成。"
  - order: "21"
    entry: kant
    sort_date: 1781
    date_label: "1781年"
    era: "近代"
    note: "批判哲学为理性划定边界，调和经验与理性。其绝对命令确立普遍道德，开启德国古典哲学。"
  - order: "22"
    entry: french-revolution
    sort_date: 1789
    date_label: "1789年"
    era: "近代"
    note: "自由平等博爱，颠覆欧洲旧制度。民族国家与公民理念由此输出，回波震荡全欧。"
  - order: "23"
    entry: evolution-theory
    sort_date: 1859
    date_label: "1859年"
    era: "近代"
    note: "生命科学的革命，自然选择重塑人的自我认识。与工业革命并峙，达尔文把“历史”引入自然。"
  - order: "24"
    entry: genetics
    sort_date: 1900
    date_label: "约1900年"
    era: "现当代"
    note: "孟德尔定律重生，基因登上舞台。与进化论汇流，生命从密码层面被理解，分子生物学兴起。"
  - order: "25"
    entry: quantum-mechanics
    sort_date: 1900
    date_label: "约1900年"
    era: "现当代"
    note: "普朗克能量量子化，微观世界告别连续图景。量子论重构实在与因果，是现代技术的基石。"
  - order: "26"
    entry: relativity
    sort_date: 1905
    date_label: "约1905年"
    era: "现当代"
    note: "爱因斯坦重写时空与引力，质能等价重塑物质观。超越牛顿绝对时空，开辟宇宙学新境。"
  - order: "27"
    entry: big-bang
    sort_date: 1929
    date_label: "约1929年"
    era: "现当代"
    note: "宇宙膨胀与大爆炸模型，赋予宇宙起源与年龄。宇宙学成为可检验的科学，回应“我们从何而来”。"
  - order: "28"
    entry: computer
    sort_date: 1936
    date_label: "1936年"
    era: "现当代"
    note: "可计算性理论与电子计算机，信息时代地基。逻辑被物化为电路，算力就此爆炸。"
  - order: "29"
    entry: internet
    sort_date: 1969
    date_label: "1969年"
    era: "现当代"
    note: "从阿帕网到全球互联，信息传播的第二次革命。知识、商业与公共生活被重塑。"
  - order: "30"
    entry: globalization
    sort_date: 1990
    date_label: "约1990年"
    era: "现当代"
    note: "冷战后经贸与信息互联高速深化。供应链全球铺开，增长与不平等、互联与张力并存。"
