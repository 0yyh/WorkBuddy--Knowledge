id: philosophy-history
title: 哲学史主线
category: 哲学
order_mode: chronological
description: 从古代到当代的哲学演进主线，串联东西方哲学的关键人物、学派与转折。它呈现哲学如何追问本原、知识、伦理与政治——从米利都到雅典，从诸子到宋明，从笛卡尔到康德、黑格尔与尼采，直至存在主义对现代性的回应。
items:
  - order: "1"
    entry: ancient-greek-philosophy
    sort_date: -585
    date_label: "约公元前6世纪"
    era: "古代"
    note: "米利都学派（泰勒斯等）首以自然本身追问万物本原，哲学与科学在同一冲动中诞生。由自然哲学到本体论、伦理学的展开，奠定了西方理性探问的基本姿态。"
  - order: "2"
    entry: confucius
    sort_date: -551
    date_label: "公元前551年"
    era: "古代"
    note: "孔子创立儒家，以“仁”与“礼”回应礼崩乐坏，把哲学重心转向伦理与政治秩序。“有教无类”与修齐治平的理想，塑造了此后两千年中国文明的价值主脉。"
  - order: "3"
    entry: daoism
    sort_date: -500
    date_label: "约公元前5世纪"
    era: "古代"
    note: "老子《道德经》倡“道法自然”“无为而治”，以柔克刚、反璞归真。道家与儒家互补，构成中国思想中超越与自在的一极，深刻影响艺术、政治与养生。"
  - order: "4"
    entry: buddhism
    sort_date: -480
    date_label: "约公元前5世纪"
    era: "古代"
    note: "佛陀立教，以四圣谛直面苦与无常，指出现象无我与解脱之道。佛教东传后与儒道交融，发展出禅宗等中国化形态，重塑了东亚的精神世界。"
  - order: "5"
    entry: plato
    sort_date: -387
    date_label: "公元前387年"
    era: "古代"
    note: "柏拉图创学园，以“理念论”区分可感世界与永恒理型，奠定西方形而上学与知识论的核心问题。其《理想国》把哲学、政治与灵魂连为一体。"
  - order: "6"
    entry: the-republic
    sort_date: -375
    date_label: "约公元前375年"
    era: "古代"
    note: "柏拉图的《理想国》以“正义”为线索，借洞穴喻说揭示意见与真理的落差，构想哲人王治理的城邦。它既是政治哲学的原典，也开启了乌托邦与理念之辩。"
  - order: "7"
    entry: aristotle
    sort_date: -343
    date_label: "公元前343年"
    era: "古代"
    note: "亚里士多德集希腊学术之大成，创立逻辑学、系统化的形而上学、伦理学与政治学。其“中道”与实践智慧，以及四因说，长期主宰了西方的知与行。"
  - order: "8"
    entry: stoicism
    sort_date: -300
    date_label: "约公元前300年"
    era: "古代"
    note: "斯多葛学派（芝诺、塞内卡、马可·奥勒留）主张顺应自然、以理性驾驭激情，在命运面前保持内心自由。其坚韧与节制的伦理，深刻影响了罗马与后世的公民德行。"
  - order: "9"
    entry: scholasticism
    sort_date: 1100
    date_label: "约11—13世纪"
    era: "中世纪"
    note: "经院哲学以理性论证信仰，阿奎那等人试图调和亚里士多德与神学。它承希腊余绪、启近代思维，大学与演绎体系在此成熟，是古典与近代之间的渡桥。"
  - order: "10"
    entry: renaissance
    sort_date: 1400
    date_label: "约14—15世纪"
    era: "中世纪"
    note: "文艺复兴以人文主义重估古典与人，哲学由神本转向人本。皮科、蒙田等张扬个体与怀疑，为宗教改革与科学觉醒铺设了思想土壤。"
  - order: "11"
    entry: machiavelli
    sort_date: 1513
    date_label: "约1513年"
    era: "中世纪"
    note: "马基雅维利《君主论》以现实政治剥离道德与统治，开启政治哲学的现实主义。他让“国家理由”独立于伦理，与同期的宗教改革共同松动了中古秩序。"
  - order: "12"
    entry: descartes
    sort_date: 1637
    date_label: "1637年"
    era: "近代"
    note: "笛卡尔以“我思故我在”为知识重建不可动摇的基点，确立主体与理性的优先。心物二元论开启近代认识论，也埋下身心难题的伏笔。"
  - order: "13"
    entry: enlightenment
    sort_date: 1700
    date_label: "约18世纪"
    era: "近代"
    note: "启蒙运动以理性审视一切，洛克、休谟、卢梭追问知识、自由与契约。它推动宽容、进步与宪政理念，为现代民主提供哲学根基。"
  - order: "14"
    entry: kant
    sort_date: 1781
    date_label: "1781年"
    era: "近代"
    note: "康德《纯粹理性批判》划定理性的边界，调和经验与理性、为自然立法。其道德哲学以“绝对命令”确立普遍义务，开启德国古典哲学，也回应了休谟的怀疑。"
  - order: "15"
    entry: hegel
    sort_date: 1807
    date_label: "1807年"
    era: "近代"
    note: "黑格尔以辩证法刻画绝对精神的自我展开，把历史、逻辑与自由统于一炉。其唯心体系既被青年黑格尔派反转，也深刻启发了马克思，是德国古典哲学的顶点。"
  - order: "16"
    entry: nietzsche
    sort_date: 1882
    date_label: "约1882年"
    era: "近代"
    note: "尼采宣告“上帝已死”，重估一切价值，以权力意志与超人挑战基督教道德与虚无主义。他对真理、道德谱系的解构，预示了现代性与后现代的张力。"
  - order: "17"
    entry: existentialism
    sort_date: 1943
    date_label: "约1943年"
    era: "现当代"
    note: "存在主义（萨特、加缪、海德格尔）主张“存在先于本质”，人在荒诞中自己造就自身。它把哲学的重心拉回个体处境与自由选择，是对现代异化与意义危机的回应。"
