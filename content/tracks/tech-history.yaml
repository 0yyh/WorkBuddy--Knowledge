id: tech-history
title: 科学技术史主线
category: 科学技术
order_mode: chronological
description: 从古代数理传统到信息时代的科学技术演进主线，串联科学发现与技术发明的里程碑。它呈现人类如何以数学与实验把握自然——从几何原本到量子与相对论，从蒸汽机到计算机与互联网，认识与改造世界的能力跃迁。
items:
  - order: "1"
    entry: euclidean-geometry
    sort_date: -300
    date_label: "约公元前300年"
    era: "古代"
    note: "欧几里得《几何原本》以少数公理演绎出恢廓的几何体系，确立公理化、证明化的知识理想。它不仅是数学的典范，更塑造了西方“从自明前提出发”的理性范式。"
  - order: "2"
    entry: astronomy
    sort_date: 150
    date_label: "约2世纪"
    era: "古代"
    note: "托勒密《天文学大成》以本轮—均轮体系总结古代天文学，支配了千年宇宙观。它既是观测与几何的集大成，也因其地心框架成为后来革命的对象。"
  - order: "3"
    entry: printing-press
    sort_date: 1440
    date_label: "约1440年"
    era: "中世纪"
    note: "古腾堡的金属活字印刷，使书籍量产、知识不再为少数人垄断。它是信息传播的第一次革命，直接助推宗教改革、科学交流与新思想的扩散。"
  - order: "4"
    entry: scientific-revolution
    sort_date: 1543
    date_label: "1543年"
    era: "近代"
    note: "哥白尼《天体运行论》把太阳置于中心，开启宇宙观的范式转换。开普勒、伽利略、牛顿接力，自然被理解为可数学化、可检验的规律世界。"
  - order: "5"
    entry: scientific-method
    sort_date: 1620
    date_label: "1620年"
    era: "近代"
    note: "培根《新工具》倡归纳与实验，以“知识即力量”把科学导向改造自然。它与笛卡尔的演绎互补，构成现代科学方法的两翼。"
  - order: "6"
    entry: classical-mechanics
    sort_date: 1687
    date_label: "1687年"
    era: "近代"
    note: "牛顿《自然哲学的数学原理》以三大定律与引力统一天上地下，力学体系集大成。它为工程、航海与工业革命提供理论引擎，也确立了决定论的世界图景。"
  - order: "7"
    entry: steam-engine
    sort_date: 1712
    date_label: "1712年"
    era: "近代"
    note: "纽科门大气机到瓦特分离冷凝器，蒸汽动力摆脱人力水力。它是第一次工业革命的心脏，把化石能量转化为可移动的功，机器时代由此开启。"
  - order: "8"
    entry: industrial-revolution
    sort_date: 1760
    date_label: "约1760年"
    era: "近代"
    note: "蒸汽、纺织与冶金合力引爆生产方式变革，工厂取代作坊、城市膨胀。资本主义世界体系与近代社会结构在此奠基，也带来阶层分化与生态代价。"
  - order: "9"
    entry: thermodynamics
    sort_date: 1824
    date_label: "1824年"
    era: "近代"
    note: "卡诺以热机效率叩问能量的极限，热力学定律随之确立。“熵”的概念揭示了不可逆与方向性，为能量科学乃至时间之箭提供物理基础。"
  - order: "10"
    entry: evolution-theory
    sort_date: 1859
    date_label: "1859年"
    era: "近代"
    note: "达尔文《物种起源》以自然选择解释物种变迁，把生命纳入历史与机制。它颠覆了神创与目的论，重塑了人在自然中的位置。"
  - order: "11"
    entry: charles-darwin
    sort_date: 1859
    date_label: "1859年"
    era: "近代"
    note: "达尔文以贝格尔号环球考察积累证据，系统提出进化论。其谨慎的经验风格与《人类的由来》，把生物学建立在观察与推论之上，与《物种起源》同为该转折的双璧。"
  - order: "12"
    entry: periodic-table
    sort_date: 1869
    date_label: "1869年"
    era: "近代"
    note: "门捷列夫以原子量排布元素、预言未知元素，化学首次呈现系统秩序。周期律揭示物质深处的结构节律，是近代化学范式成形的标志。"
  - order: "13"
    entry: quantum-mechanics
    sort_date: 1900
    date_label: "1900年"
    era: "现当代"
    note: "普朗克提出能量量子化，微观世界告别连续的经典图景。爱因斯坦、玻尔、海森堡接力，量子论重构了实在、测量与因果，是现代技术的基石。"
  - order: "14"
    entry: genetics
    sort_date: 1900
    date_label: "约1900年"
    era: "现当代"
    note: "孟德尔定律在世纪之交被重新发现，基因作为遗传单位登上舞台。它与进化论汇流，分子生物学随之兴起，人类开始从密码层面理解生命。"
  - order: "15"
    entry: relativity
    sort_date: 1905
    date_label: "约1905年"
    era: "现当代"
    note: "爱因斯坦狭义与广义相对论重写时间、空间与引力，质能等价(E=mc²)重塑物质观。它超越了牛顿的绝对时空，为宇宙学与现代物理开辟新境。"
  - order: "16"
    entry: big-bang
    sort_date: 1929
    date_label: "约1929年"
    era: "现当代"
    note: "哈勃发现宇宙膨胀、伽莫夫等提出大爆炸模型，宇宙被赋予起源与年龄。从奇点到星系的演变，使宇宙学成为可检验的科学，回应了“我们从何而来”。"
  - order: "17"
    entry: computer
    sort_date: 1936
    date_label: "1936年"
    era: "现当代"
    note: "图灵提出可计算性、冯·诺依曼架构落地，电子计算机从理论走向机器。它是信息时代的地基，把逻辑运算物化为电路，开启算力爆炸。"
  - order: "18"
    entry: internet
    sort_date: 1969
    date_label: "1969年"
    era: "现当代"
    note: "从阿帕网到万维网，网络把计算机连成全球大脑。它是信息传播的第二次革命，重塑了知识、商业与公共生活，也带来隐私与治理的新课题。"
