id: history-world
title: 世界历史主线
category: 历史/世界史
order_mode: chronological
timeline: world
description: 从全球视角的历史主线，按时间顺序串联从古典帝国到当代的关键事件与思潮。它呈现西方从城邦、帝国到民族国家的演进，科学革命与启蒙如何重塑理性，工业革命与大革命如何重构社会，以及冷战与全球化怎样连成一体。
items:
  - order: "1"
    entry: mesopotamia
    sort_date: -3500
    date_label: "约公元前3500年"
    era: "古代"
    note: "两河流域（幼发拉底河与底格里斯河之间）孕育了已知最早的城市文明：苏美尔人以楔形文字、城邦（乌鲁克、乌尔）与神庙经济奠基；其后阿卡德、巴比伦（汉谟拉比法典）与亚述相继崛起。灌溉农业、青铜与官僚体系在此成熟，并为《圣经》叙事与希腊近东史观提供背景。"
  - order: "2"
    entry: ancient-egypt
    sort_date: -3100
    date_label: "约公元前3100年"
    era: "古代"
    note: "上下埃及统一，法老神权国家兴起，金字塔与象形文字标志着人类最早的文明之一。尼罗河的周期泛滥催生了稳定的农业官僚体系，为后世「治水的国家」提供原型。"
  - order: "3"
    entry: democracy
    sort_date: -508
    date_label: "公元前508年"
    era: "古代"
    note: "克利斯提尼改革（前508）以地域部落取代血缘部落、创设陶片放逐，雅典民主奠基；伯里克利时代（前461—前429）公民大会与陪审团达于鼎盛。直接民主成为西方政治的重要原型，也暴露了多数决的边界。"
  - order: "4"
    entry: buddhism
    sort_date: -500
    date_label: "约公元前5世纪"
    era: "古代"
    note: "公元前5世纪前后，释迦牟尼于恒河流域创立佛教，提出四谛八正道，以缘起无我消解苦的生成。它东传中亚、经丝路入华，与儒道交融，成为亚洲文明共享的精神资源之一。"
  - order: "5"
    entry: roman-empire
    sort_date: -27
    date_label: "公元前27年"
    era: "古代"
    note: "屋大维确立元首制，罗马由共和国转入帝国，以法律、道路与军团维系地中海世界的秩序。罗马法与现代共和制度的遗产，至今仍塑造着西方政治语言。"
  - order: "6"
    entry: division-of-rome
    title: "罗马帝国分裂"
    sort_date: 395
    date_label: "395年"
    era: "古代"
    note: "狄奥多西一世死后（395）帝国正式分为东西两部，西罗马都拉文纳、东罗马（拜占庭）都君士坦丁堡。西罗马于476年亡于蛮族，欧洲步入中世纪；东罗马延祚至1453年。"
  - order: "7"
    entry: byzantine-empire
    title: "拜占庭帝国"
    sort_date: 527
    date_label: "约527年（查士丁尼时代）"
    era: "中世纪"
    note: "罗马帝国分裂（395）后，东部的拜占庭帝国以君士坦丁堡为中心延续近千年；查士丁尼（527—565）编纂《罗马民法大全》、短暂复夺北非与意大利，圣索菲亚大教堂象征政教合一的东正教文明。它守护古典学问、缓冲伊斯兰扩张，1453年陷于奥斯曼，为中世纪欧洲留下罗马法遗产。"
  - order: "8"
    entry: arab-empire
    title: "阿拉伯帝国"
    sort_date: 632
    date_label: "632—1258年"
    era: "中世纪"
    note: "632年伊斯兰社群在阿拉伯半岛统一，四大哈里发与倭马亚、阿拔斯王朝迅速扩张为地跨三洲的帝国；巴格达（762）成为翻译、天文与医学中心，保存并光大希腊古典与波斯—印度知识。它连接东西方贸易与学术，深刻塑造中世纪地中海与印度洋世界。"
  - order: "9"
    entry: medieval-universities
    title: "中世纪大学兴起"
    sort_date: 1088
    date_label: "约1088年"
    era: "中世纪"
    note: "博洛尼亚（1088）、巴黎与牛津（约1167）等大学相继成立，行会式学术自治与经院哲学（阿奎那）兴盛，保存并再造古典学问，为近代大学建制与理性传统奠基。"
  - order: "10"
    entry: crusades
    sort_date: 1096
    date_label: "1096年"
    era: "中世纪"
    note: "十字军东征拉开宗教战争的序幕，圣地争夺牵动地中海与近东。它意外促进了东西方物资与知识的交流，重燃欧洲对古典与东方的兴趣，为后来的复兴埋下伏笔。"
  - order: "11"
    entry: renaissance
    sort_date: 1300
    date_label: "约1300年"
    era: "中世纪"
    note: "14世纪前后意大利城邦（佛罗伦萨·美第奇）复兴古典、倡扬人文主义，以人为中心重估现世价值。艺术与学术的繁荣、印刷术的配合，使欧洲由中世纪走向近代，个体与理性的地位上升。"
  - order: "12"
    entry: black-death
    title: "黑死病"
    sort_date: 1347
    date_label: "1347—1351年"
    era: "中世纪"
    note: "1347—1351年鼠疫（耶尔森菌）沿地中海与商路席卷欧亚，欧洲损失约三分之一人口。劳动力骤减推高工资、动摇农奴制与教会权威，催生工资劳动与世俗化，也助长排犹与猎巫；它是中世纪向近代社会转型的隐性拐点。"
  - order: "13"
    entry: printing-press
    sort_date: 1455
    date_label: "1455年"
    era: "中世纪"
    note: "约1450—1455年古腾堡于美因茨以活字金属印刷《四十二行圣经》，书籍成本骤降、知识大规模扩散，直接助推宗教改革与科学革命，是信息传播的革命性转折。"
  - order: "14"
    entry: age-of-discovery
    sort_date: 1492
    date_label: "1492年"
    era: "中世纪"
    note: "1492年哥伦布抵达美洲、1498年达·伽马绕好望角，新航路将孤立的大陆首次连成一体。白银、作物与瘟疫在全球流动，殖民帝国兴起，世界史进入真正的「全球」阶段。"
  - order: "15"
    entry: machiavelli
    sort_date: 1513
    date_label: "1513年"
    era: "中世纪"
    note: "马基雅维利《君主论》以冷峻的眼光剥离道德与政治，主张「为保国可不必守德」。它开启政治学的现实主义传统，把统治术从神学与伦理中解放出来，成为近代国家理由学说的先声。"
  - order: "16"
    entry: protestant-reformation
    title: "宗教改革"
    sort_date: 1517
    date_label: "1517年"
    era: "近代"
    note: "1517年马丁·路德贴出《九十五条论纲》，质疑赎罪券与教宗权威，新教兴起，欧洲陷入宗教战争（1555年奥格斯堡和约、1618年三十年战争）。世俗政权与信仰分离加速，民族国家意识抬头。"
  - order: "17"
    entry: scientific-revolution
    sort_date: 1543
    date_label: "1543年"
    era: "近代"
    note: "1543年哥白尼《天体运行论》到1687年牛顿《原理》，自然被重新理解为可数学化、可检验的规律世界。实验与理性的结合奠定了现代科学方法，也动摇了神学对宇宙的垄断。"
  - order: "18"
    entry: enlightenment
    sort_date: 1700
    date_label: "约1700年"
    era: "近代"
    note: "启蒙哲人高举理性，审视权威、教会与专制，倡自由、平等、人权与进步。洛克、伏尔泰、卢梭的思想为英美革命与法国大革命提供弹药，也塑造了现代价值观。"
  - order: "19"
    entry: industrial-revolution
    sort_date: 1760
    date_label: "1760年"
    era: "近代"
    note: "1760年代起蒸汽机（瓦特1776改良）与工厂制引爆生产力革命，英国率先由农业社会转入工业社会。资本主义世界体系随之扩张，城市化、阶级分化与殖民加剧，现代经济的骨架就此搭成。"
  - order: "20"
    entry: american-revolution
    title: "美国独立"
    sort_date: 1776
    date_label: "1776年7月4日"
    era: "近代"
    note: "1776年7月4日大陆会议通过《独立宣言》，北美十三殖民地脱离英国；1783年《巴黎条约》承认独立，1787年宪法立联邦共和。启蒙思想首次落为现代宪政国家，冲击旧世界君主秩序。"
  - order: "21"
    entry: french-revolution
    sort_date: 1789
    date_label: "1789年7月14日"
    era: "近代"
    note: "1789年7月14日巴士底狱倒塌，「自由平等博爱」颠覆旧制度，封建特权被废除。革命以激进方式输出民族国家与公民理念，其回波震荡全欧，也警示了群众政治的暴力潜能。"
  - order: "22"
    entry: napoleonic-wars
    title: "拿破仑战争"
    sort_date: 1815
    date_label: "1815年"
    era: "近代"
    note: "1804年拿破仑称帝，横扫欧陆推行《拿破仑法典》与民族原则，却陷于半岛与俄战。1815年滑铁卢败于反法同盟，维也纳体系重划欧洲，自由民族主义暗流涌动。"
  - order: "23"
    entry: opium-war
    sort_date: 1840
    date_label: "1840年"
    era: "近代"
    note: "鸦片战争是殖民扩张撞上东亚秩序的节点，清帝国战败被迫开国。它既是世界史中帝国竞逐的一幕，也把中国推入近代变局，故标注为跨中国/世界双时间线。"
    cross_timeline: true
  - order: "24"
    entry: meiji-restoration
    title: "明治维新"
    sort_date: 1868
    date_label: "1868年"
    era: "近代"
    note: "1868年明治天皇亲政，倒幕废藩置县，推行「富国强兵·殖产兴业·文明开化」，日本快速近代化并走上对外扩张，亚洲首个西式强国诞生，深刻改变东亚格局。"
  - order: "25"
    entry: first-world-war
    sort_date: 1914
    date_label: "1914年7月28日"
    era: "近代"
    note: "1914年6月28日萨拉热窝刺杀，7月28日奥匈对塞宣战，一战全面爆发。总体战重塑世界：帝国崩解、美国崛起、欧洲霸权松动，堑壕与工业化屠杀暴露进步叙事的阴影，也为二战与革命埋下种子。"
  - order: "26"
    entry: october-revolution
    sort_date: 1917
    date_label: "1917年11月7日"
    era: "近代"
    note: "1917年11月（俄历10月25日）俄国爆发十月革命，建立第一个社会主义国家，以计划经济与无产阶级专政挑战资本主义体系。它改写了二十世纪的政治地图，与西方的冷战对峙由此发端。"
  - order: "27"
    entry: second-world-war
    title: "第二次世界大战"
    sort_date: 1939
    date_label: "1939年9月1日"
    era: "现当代"
    note: "1939年9月1日德国闪击波兰，英法对德宣战，二战全面爆发；1941年苏德战争与太平洋战争使其全球化。1945年轴心败亡，联合国成立、美苏崛起，世界权力彻底重组。"
  - order: "28"
    entry: cold-war
    sort_date: 1947
    date_label: "1947年"
    era: "现当代"
    note: "1947年杜鲁门主义出台，美苏两极以核威慑对峙，代理人战争与意识形态竞赛蔓延全球。它分割了世界也推动了科技与太空竞赛，1991年苏联解体后单极时刻降临。"
  - order: "29"
    entry: dissolution-of-ussr
    title: "苏联解体"
    sort_date: 1991
    date_label: "1991年12月25日"
    era: "现当代"
    note: "1991年12月25日戈尔巴乔夫辞职、苏联红旗降下，冷战终结，15个加盟共和国独立，美国成为唯一超级大国，单极时刻与全球化加速到来。"
  - order: "30"
    entry: internet
    sort_date: 1990
    date_label: "约1990年"
    era: "现当代"
    note: "1989—1991年伯纳斯-李发明万维网，1990年代互联网走向大众，信息以空前速度互联。它重塑传播、商业与公共生活，与全球化互为因果，开启数字时代。"
  - order: "31"
    entry: globalization
    sort_date: 1990
    date_label: "约1990年"
    era: "现当代"
    note: "冷战落幕，经贸、资本与信息以前所未有的速度互联，供应链全球铺开、互联网普及。全球化带来增长也加剧不平等，逆全球化与地缘张力在世纪之交重新抬头。"
