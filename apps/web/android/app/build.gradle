// 内容目录下的搜索索引在 web 产物里一律以 `index/`（不带前导点）命名：
// 见 scripts/copy-content.mjs —— `.index` 会被 Capacitor 的 cap sync（dot:false）
// 与 AGP 的 MergeAssets 双重丢弃，导致 Android 端 fetch 索引 404。
// 改名后这里无需任何额外的资源注入。
// ---------------------------------------------------------------------------
