items:
  - slug: monetary-base
    title: 基础货币
    categories:
      - 经济学/金融/货币与银行
    timeline: []
    see_also: [money, central-banking, inflation]
    outline:
      - 基础货币的定义与构成（流通中现金 + 银行准备金）
      - 基础货币与货币乘数的关系
      - 央行如何投放与回笼基础货币
    sources:
      - title: Monetary Base - Wikipedia
        url: https://en.wikipedia.org/wiki/Monetary_base
        license: Fair-Use
    material: |
      基础货币（monetary base / high-powered money）是央行负债，由流通中现金（C）与商业银行在央行的
      准备金（R）构成。货币供应 M = 基础货币 × 货币乘数。

